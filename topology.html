<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OLT / PON Topology</title>
<script src="config.js"></script>
<script src="auth.js"></script>
<style>
  :root{
    --bg:#0b1220;
    --bg2:#0e1626;
    --panel-bg:#101a2c;
    --panel-border:#1c2740;
    --text:#e7ebf3;
    --text-dim:#8b93a7;
    --line:#3a4560;
    --line-loss0:#3fbf6b;
    --line-lossmid:#e2a13d;
    --line-lossred:#e35b5b;
    --blue-sel:#4d8cff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;}
  .app{display:flex;flex-direction:column;height:100vh;}

  .topbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:12px 16px;
    background:var(--bg2);
    border-bottom:1px solid var(--panel-border);
  }
  select,.tbtn,.tsearch{
    background:#0e1728;
    border:1px solid #26314a;
    color:var(--text);
    border-radius:8px;
    padding:8px 14px;
    font-size:13.5px;
  }
  .tbtn{cursor:pointer;}
  .tbtn:hover{border-color:#3d4b6b;}
  .tsearch{min-width:160px;}
  .chk{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text-dim);}
  .chk input{accent-color:var(--blue-sel);}

  .toolbar2{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:8px 16px;
    background:var(--bg2);
    border-bottom:1px solid var(--panel-border);
    font-size:12.5px;color:var(--text-dim);
  }
  .zbtn{
    width:30px;height:30px;border-radius:7px;
    background:#0e1728;border:1px solid #26314a;color:var(--text);
    cursor:pointer;font-size:14px;
  }
  .zbtn:hover{border-color:#3d4b6b;}
  .zwide{width:auto;padding:0 14px;}

  .body{flex:1;display:flex;min-height:0;}
  .canvas-wrap{flex:1;position:relative;overflow:hidden;cursor:grab;background:radial-gradient(ellipse at 50% 0%, #101c30 0%, #0b1220 60%);}
  .canvas-wrap.dragging{cursor:grabbing;}
  #svgLayer{position:absolute;top:0;left:0;}

  .sidebar{
    width:300px;flex-shrink:0;
    background:var(--panel-bg);
    border-left:1px solid var(--panel-border);
    padding:18px;
    overflow-y:auto;
  }
  .panel-box{
    background:#0e1728;
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:16px;
    margin-bottom:16px;
  }
  .panel-title{font-weight:700;font-size:14px;margin-bottom:10px;}
  .panel-empty{color:var(--text-dim);font-size:13px;}
  .detail-name-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .detail-name{color:var(--blue-sel);font-weight:700;font-size:14.5px;}
  .detail-badge{
    background:#1c2740;border-radius:6px;padding:2px 8px;font-size:11.5px;color:var(--text-dim);
  }
  .detail-row{font-size:13px;color:var(--text-dim);margin:4px 0;}
  .detail-row b{color:var(--text);font-weight:600;}
  .detail-row .diffneg{color:#e35b5b;font-weight:700;}
  .detail-btn{
    width:100%;text-align:left;
    background:#111d33;border:1px solid #263252;
    color:var(--text);border-radius:8px;padding:9px 12px;
    font-size:13px;margin-top:8px;cursor:pointer;
  }
  .detail-btn:hover{border-color:#3d4b6b;}
  .path-step{font-size:13.5px;margin:4px 0;}
  .path-arrow{color:var(--text-dim);font-size:12px;margin-left:2px;}

  svg text{font-family:inherit;user-select:none;}
  .node-onu{cursor:pointer;}
  .node-splitter{cursor:pointer;}

  @media (max-width:800px){
    .sidebar{position:absolute;right:0;top:0;bottom:0;z-index:20;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <select id="oltSel"><option>Ark OLT 1 (ID 3)</option></select>
    <select id="ponSel">
      <option value="1">PON 1 • Out 9.00 dBm</option>
      <option value="2">PON 2 • Out 7.00 dBm</option>
      <option value="3">PON 3 • Out 8.00 dBm</option>
    </select>
    <button class="tbtn" id="loadBtn">Load</button>
    <button class="tbtn" id="recalcBtn">Recalc Est Power</button>
    <a href="dashboard.html" style="color:#8b93a7;font-size:13px;text-decoration:none;margin-right:6px;">← Home</a>
    <input class="tsearch" id="searchInput" placeholder="Search node...">
    <label class="chk"><input type="checkbox" id="collapseChk" checked> Collapse splitters</label>
    <button class="tbtn" id="expandBtn">Expand all</button>
  </div>
  <div class="toolbar2">
    <button class="zbtn" id="zoomOut">−</button>
    <button class="zbtn" id="zoomIn">+</button>
    <button class="zbtn zwide" id="centerBtn">Center</button>
    <button class="zbtn zwide" id="fitBtn">Fit</button>
    <span>Wheel zoom • Drag to pan • Click node • Double click splitter • Click empty to clear</span>
  </div>

  <div class="body">
    <div class="canvas-wrap" id="canvasWrap">
      <svg id="svgLayer" width="100%" height="100%"></svg>
    </div>
    <div class="sidebar">
      <div class="panel-box">
        <div class="panel-title">Details</div>
        <div id="detailsBody"><div class="panel-empty">Select a node to see details...</div></div>
      </div>
      <div class="panel-box">
        <div class="panel-title">Path Steps</div>
        <div id="pathBody"><div class="panel-empty">Click a node to see its path...</div></div>
      </div>
      <div class="panel-box">
        <div class="panel-title">Unlinked</div>
        <div class="panel-empty">No unlinked ONUs/devices.</div>
      </div>
    </div>
  </div>
</div>

<script>
const BACKEND_URL = window.ISP_BACKEND_URL;

/* ---------- Demo tree (used only as a fallback if the backend is unreachable) ---------- */
const ONU_NAMES = ['ravi','sunitha','prakash','laxmi','naveen','ramu','kiran','harika','sandeep','bhavani','venu','anitha','dinesh','rakesh','sirisha','ganesh','padma','vamsi','sowmya','rajesh','shilpa'];
let nameIdx = 0;
function nextName(){ return ONU_NAMES[nameIdx++ % ONU_NAMES.length] + (nameIdx>ONU_NAMES.length ? nameIdx : ''); }

function makeOnu(name, extra){
  const rt = -(20 + Math.random()*10).toFixed(2)*1;
  const est = -(11 + Math.random()*3).toFixed(2)*1;
  const diff = +(rt-est).toFixed(2);
  return Object.assign({
    type:'onu', id:'onu_'+Math.random().toString(36).slice(2),
    name, dist: Math.round(2800+Math.random()*900)+' m',
    rt: rt.toFixed(2), est: est.toFixed(2), diff: diff.toFixed(2),
    fiberLoss: '0.000', status:'Online', via: 1+Math.floor(Math.random()*4),
    children: []
  }, extra||{});
}
function makeSplitter(label, ratio, children){
  return { type:'splitter', id:'sp_'+Math.random().toString(36).slice(2), label, ratio, children };
}
function randomBranch(depth){
  if(depth<=0) return makeOnu(nextName());
  const n = 2+Math.floor(Math.random()*2);
  const kids=[];
  for(let i=0;i<n;i++){
    if(Math.random()<0.45 && depth>1) kids.push(randomBranch(depth-1));
    else kids.push(makeOnu(nextName()));
  }
  return makeSplitter('1x'+n, '', kids);
}
function buildDemoTree(ponLabel){
  const branch1 = makeSplitter('1x3','', [randomBranch(2), randomBranch(2), randomBranch(1)]);
  const branch2 = makeSplitter('1x2','', [randomBranch(2), randomBranch(2)]);
  const ponNode = { type:'pon', id:'pon', label:ponLabel, children:[branch1, branch2] };
  return { type:'olt', id:'olt', label:'Ark OLT 1', children:[ponNode] };
}

/* ---------- Real tree, built from backend ONU data ---------- */
function onuToLeaf(o){
  const hasPower = o.rx_power != null && o.est_power != null;
  return {
    type:'onu', id:'onu_'+o.id, name:o.name,
    dist: o.distance ? o.distance+' m' : '-',
    rt: o.rx_power != null ? o.rx_power.toFixed(2) : '-',
    est: o.est_power != null ? o.est_power.toFixed(2) : '-',
    diff: hasPower ? (o.rx_power - o.est_power).toFixed(2) : '-',
    fiberLoss: '0.000',
    status: o.status, via: o.pon_id,
    children: []
  };
}
async function buildTreeFromBackend(ponId, ponLabel){
  const res = await fetch(`${BACKEND_URL}/api/onus?pon_id=${ponId}`);
  const onus = await res.json();
  if(onus.length === 0) throw new Error('No ONUs for this PON yet');
  const leaves = onus.map(onuToLeaf);
  const splitter = makeSplitter('1x'+leaves.length, '', leaves);
  const ponNode = { type:'pon', id:'pon', label:ponLabel, children:[splitter] };
  return { type:'olt', id:'olt', label:'Ark OLT 1', children:[ponNode] };
}

let oltNode = buildDemoTree('PON 1'); // placeholder until first load resolves

/* ---------- Layout ---------- */
const LEVEL_H = 95;
const LEAF_W = 62;
let leafCounter;
function layout(node, depth){
  node.depth = depth;
  if(!node.children || node.children.length===0 || node.collapsed){
    node.x = leafCounter.n * LEAF_W;
    leafCounter.n++;
    node.y = depth*LEVEL_H;
    return node.x;
  }
  const xs = node.children.map(c=>layout(c, depth+1));
  node.x = (Math.min(...xs)+Math.max(...xs))/2;
  node.y = depth*LEVEL_H;
  return node.x;
}
function doLayout(){ leafCounter={n:0}; layout(oltNode, 0); }
doLayout();


/* ---------- Render ---------- */
const svg = document.getElementById('svgLayer');
const wrap = document.getElementById('canvasWrap');
let selectedNode = null;
let panX=140, panY=60, scale=0.85;

function lineColorFor(diff){
  if(diff===''||diff===undefined) return '#3a4560';
  const d = Math.abs(parseFloat(diff));
  if(d < 1) return 'var(--line-loss0)';
  if(d < 3) return 'var(--line-lossmid)';
  return 'var(--line-lossred)';
}

function render(){
  svg.innerHTML='';
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('transform', `translate(${panX},${panY}) scale(${scale})`);
  svg.appendChild(g);

  function walk(node, parent){
    if(parent){
      const isSel = selectedNode && (selectedNode.id===node.id);
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', parent.x); line.setAttribute('y1', parent.y+10);
      line.setAttribute('x2', node.x); line.setAttribute('y2', node.y-10);
      line.setAttribute('stroke', isSel ? '#4d8cff' : lineColorFor(node.diff));
      line.setAttribute('stroke-width', isSel ? 2.5 : 1.2);
      g.appendChild(line);

      if(node.type==='onu' && node.diff!==''){
        const label = document.createElementNS('http://www.w3.org/2000/svg','text');
        label.setAttribute('x', (parent.x+node.x)/2 + 8);
        label.setAttribute('y', (parent.y+node.y)/2);
        label.setAttribute('fill', lineColorFor(node.diff));
        label.setAttribute('font-size','11');
        label.textContent = node.diff;
        g.appendChild(label);
      }
    }

    if(node.type==='onu'){
      const isSel = selectedNode && selectedNode.id===node.id;
      const isNA = node.status==='N/A';
      const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
      circle.setAttribute('cx', node.x); circle.setAttribute('cy', node.y);
      circle.setAttribute('r', isSel? 34 : 22);
      circle.setAttribute('fill', isNA ? '#1a2338' : (isSel? '#fddede' : '#2b3550'));
      circle.setAttribute('stroke', isSel ? '#4d8cff' : (isNA? '#2a3550' :'#445070'));
      circle.setAttribute('stroke-width', isSel? 3:1.3);
      circle.setAttribute('class','node-onu');
      circle.style.opacity = isNA ? 0.35 : 1;
      circle.addEventListener('click', (e)=>{ e.stopPropagation(); selectNode(node); });
      g.appendChild(circle);

      if(!isNA){
        const t1 = mkText(node.x, node.y-4, node.dist, isSel? '#7a1f1f':'#aab3c5', 9);
        const t2 = mkText(node.x, node.y+7, node.name, isSel? '#7a1f1f':'#d7dcea', 10, true);
        const t3 = mkText(node.x, node.y+17, 'RT '+node.rt, isSel? '#7a1f1f':'#8b93a7', 8);
        g.appendChild(t1); g.appendChild(t2); g.appendChild(t3);
      } else {
        const t1 = mkText(node.x, node.y+4, 'N/A', '#5a6584', 10);
        g.appendChild(t1);
      }
    } else {
      // splitter / pon / olt
      const r = node.type==='olt' ? 10 : (node.type==='pon' ? 9 : 30);
      const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
      circle.setAttribute('cx', node.x); circle.setAttribute('cy', node.y);
      circle.setAttribute('r', r);
      circle.setAttribute('fill', node.type==='splitter' ? '#eef2fb' : '#2b3550');
      circle.setAttribute('stroke', selectedNode && selectedNode.id===node.id ? '#4d8cff':'#5a6584');
      circle.setAttribute('stroke-width', selectedNode && selectedNode.id===node.id ? 3:1.3);
      circle.setAttribute('class','node-splitter');
      circle.addEventListener('click', (e)=>{ e.stopPropagation(); selectNode(node); });
      if(node.type==='splitter'){
        circle.addEventListener('dblclick', (e)=>{
          e.stopPropagation();
          node.collapsed = !node.collapsed;
          doLayout(); render();
        });
      }
      g.appendChild(circle);
      if(node.type==='splitter'){
        g.appendChild(mkText(node.x, node.y-3, node.label, '#1f2430', 11, true, true));
        if(node.ratio) g.appendChild(mkText(node.x, node.y+10, node.ratio, '#1f2430', 10, false, true));
      } else if(node.type==='pon'){
        g.appendChild(mkText(node.x, node.y-16, node.label, '#8b93a7', 10, true));
      } else {
        g.appendChild(mkText(node.x, node.y-16, node.label, '#8b93a7', 10, true));
      }
    }

    if(node.children && !node.collapsed){
      node.children.forEach(c=>walk(c, node));
    }
  }
  walk(oltNode, null);
}
function mkText(x,y,str,fill,size,bold,anchorMid){
  const t = document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x',x); t.setAttribute('y',y);
  t.setAttribute('fill',fill); t.setAttribute('font-size',size);
  t.setAttribute('text-anchor','middle');
  if(bold) t.setAttribute('font-weight','700');
  t.textContent = str;
  return t;
}

/* ---------- Selection / Details ---------- */
function findPathTo(node, root, trail){
  if(root.id===node.id){ trail.push(root); return true; }
  if(root.children){
    for(const c of root.children){
      if(findPathTo(node, c, trail)){ trail.unshift(root); return true; }
    }
  }
  return false;
}

function selectNode(node){
  selectedNode = node;
  render();
  const db = document.getElementById('detailsBody');
  const pb = document.getElementById('pathBody');

  if(node.type==='onu' && node.status!=='N/A'){
    db.innerHTML = `
      <div class="detail-name-row"><span class="detail-name">${node.name}</span><span class="detail-badge">ONU</span></div>
      <div class="detail-row">Via: <b>${node.via}</b></div>
      <div class="detail-row">Status: <b>${node.status}</b></div>
      <div class="detail-row">Est: <b>${node.est} dBm</b></div>
      <div class="detail-row">Real: <b>${node.rt} dBm</b></div>
      <div class="detail-row">Diff: <span class="diffneg">${node.diff} dB</span></div>
      <div class="detail-row">Dist: <b>${node.dist}</b></div>
      <div class="detail-row">Fiber Loss: <b>${node.fiberLoss} dB</b></div>
      <button class="detail-btn">Edit Port</button>
      <button class="detail-btn">Unlink from Parent</button>
    `;
  } else if(node.type==='splitter'){
    db.innerHTML = `
      <div class="detail-name-row"><span class="detail-name">${node.label}</span><span class="detail-badge">Splitter</span></div>
      <div class="detail-row">Ratio: <b>${node.ratio || '-'}</b></div>
      <div class="detail-row">Ports: <b>${node.children.length}</b></div>
    `;
  } else {
    db.innerHTML = `<div class="panel-empty">Select a node to see details...</div>`;
    pb.innerHTML = `<div class="panel-empty">Click a node to see its path...</div>`;
    return;
  }

  const trail = [];
  findPathTo(node, oltNode, trail);
  const stepCount = 10+Math.floor(Math.random()*10);
  let html = `<div class="path-step">${stepCount}</div>`;
  trail.forEach((n,i)=>{
    let label = n.type==='olt' ? n.label : (n.type==='pon' ? n.label : (n.type==='splitter' ? (n.label+(n.ratio?(' '+n.ratio):'')) : n.name));
    html += `<div class="path-step">${label}</div>`;
    if(i<trail.length-1) html += `<div class="path-arrow">↓</div>`;
  });
  pb.innerHTML = html;
}

wrap.addEventListener('click', ()=>{ selectedNode=null; render();
  document.getElementById('detailsBody').innerHTML = '<div class="panel-empty">Select a node to see details...</div>';
  document.getElementById('pathBody').innerHTML = '<div class="panel-empty">Click a node to see its path...</div>';
});

/* ---------- Pan / Zoom ---------- */
let isDragging=false, lastX=0, lastY=0;
wrap.addEventListener('mousedown', e=>{ isDragging=true; lastX=e.clientX; lastY=e.clientY; wrap.classList.add('dragging'); });
window.addEventListener('mouseup', ()=>{ isDragging=false; wrap.classList.remove('dragging'); });
window.addEventListener('mousemove', e=>{
  if(!isDragging) return;
  panX += (e.clientX-lastX); panY += (e.clientY-lastY);
  lastX=e.clientX; lastY=e.clientY;
  render();
});
wrap.addEventListener('wheel', e=>{
  e.preventDefault();
  const delta = e.deltaY>0 ? 0.9 : 1.1;
  scale = Math.min(3, Math.max(0.25, scale*delta));
  render();
}, {passive:false});

document.getElementById('zoomIn').addEventListener('click', ()=>{ scale=Math.min(3,scale*1.2); render(); });
document.getElementById('zoomOut').addEventListener('click', ()=>{ scale=Math.max(0.25,scale/1.2); render(); });
document.getElementById('centerBtn').addEventListener('click', ()=>{ panX=140; panY=60; scale=0.85; render(); });
document.getElementById('fitBtn').addEventListener('click', ()=>{ panX=60; panY=40; scale=0.6; render(); });

document.getElementById('expandBtn').addEventListener('click', ()=>{
  function clearCollapse(n){ n.collapsed=false; if(n.children) n.children.forEach(clearCollapse); }
  clearCollapse(oltNode);
  doLayout(); render();
});

document.getElementById('searchInput').addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  const q = e.target.value.trim().toLowerCase();
  let found=null;
  (function search(n){ if(found) return; if(n.type==='onu' && n.name && n.name.toLowerCase()===q) found=n; if(n.children) n.children.forEach(search); })(oltNode);
  if(found){ selectNode(found); panX = window.innerWidth/2 - found.x*scale; panY = 260 - found.y*scale; render(); }
});

async function loadTopology(){
  const ponSel = document.getElementById('ponSel');
  const ponId = ponSel.value;
  const ponLabel = ponSel.options[ponSel.selectedIndex].text.split(' •')[0];
  const loadBtn = document.getElementById('loadBtn');
  loadBtn.textContent = 'Loading...'; loadBtn.disabled = true;
  try{
    oltNode = await buildTreeFromBackend(ponId, ponLabel);
  } catch(err){
    console.warn('Backend unavailable or empty, showing demo topology:', err);
    oltNode = buildDemoTree(ponLabel + ' (demo - backend unreachable)');
  }
  selectedNode = null;
  doLayout(); render();
  document.getElementById('detailsBody').innerHTML = '<div class="panel-empty">Select a node to see details...</div>';
  document.getElementById('pathBody').innerHTML = '<div class="panel-empty">Click a node to see its path...</div>';
  loadBtn.textContent = 'Load'; loadBtn.disabled = false;
}
document.getElementById('loadBtn').addEventListener('click', loadTopology);
document.getElementById('ponSel').addEventListener('change', loadTopology);
loadTopology();
document.getElementById('recalcBtn').addEventListener('click', ()=>{ render(); });

window.addEventListener('resize', render);
render();
</script>
</body>
</html>
