<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Offline ONUs</title>
<script src="config.js"></script>
<script src="auth.js"></script>
<style>
  :root{
    --page-bg:#f2f3f6;
    --text-dark:#1f2430;
    --text-gray:#6b7280;
    --text-lightgray:#9aa1ae;
    --divider:#eef0f3;
    --blue-btn:#3579f6;
    --blue-btn-dark:#2867e0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--page-bg);color:var(--text-dark);}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 24px 60px;}

  .card{
    background:#fff;
    border-radius:14px;
    box-shadow:0 2px 10px rgba(20,25,40,.05);
    padding:26px 30px 30px;
  }

  .header-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:8px;
  }
  h1{font-size:22px;margin:0 0 6px;}
  .subtitle{color:var(--text-gray);font-size:14.5px;margin:0;}
  .source-info{text-align:right;color:var(--text-lightgray);font-size:13px;line-height:1.6;}

  .controls-row{
    display:flex;
    align-items:flex-end;
    gap:14px;
    margin:22px 0 26px;
  }
  .field label{
    display:block;
    font-size:12.5px;
    color:var(--text-gray);
    margin-bottom:6px;
  }
  select{
    padding:11px 16px;
    border-radius:9px;
    border:1px solid #e3e6ec;
    background:#fff;
    font-size:14.5px;
    color:var(--text-dark);
    min-width:180px;
  }
  .refresh-btn{
    background:var(--blue-btn);
    color:#fff;
    border:none;
    border-radius:9px;
    padding:11px 22px;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
  }
  .refresh-btn:hover{background:var(--blue-btn-dark);}
  .refresh-btn:disabled{opacity:.6;cursor:default;}

  .summary-cards{
    display:flex;
    gap:16px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .sum-card{
    flex:1;
    min-width:190px;
    border-radius:10px;
    padding:16px 18px;
    background:#f5f6f8;
  }
  .sum-card.wiredown{background:#fdeceb;}
  .sum-card.poweroff{background:#fdf8e3;}
  .sum-card.na{background:#fbf3c8;}
  .sum-title{font-size:13px;color:var(--text-gray);margin-bottom:6px;}
  .sum-card.wiredown .sum-title{color:#c0392b;}
  .sum-card.poweroff .sum-title,.sum-card.na .sum-title{color:#9a7c15;}
  .sum-value{font-size:24px;font-weight:800;color:var(--text-dark);}
  .sum-card.wiredown .sum-value{color:#c0392b;}
  .sum-sub{font-size:12px;color:var(--text-gray);margin-top:4px;}

  .loaded-note{color:var(--text-gray);font-size:14px;margin-bottom:18px;}

  .pon-section{
    background:#fff;
    border:1px solid var(--divider);
    border-radius:12px;
    margin-bottom:20px;
    overflow:hidden;
  }
  .pon-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 20px;
    font-weight:700;
    font-size:15px;
  }
  .pon-header .pon-offline{font-weight:500;font-size:13px;color:var(--text-gray);}

  table{width:100%;border-collapse:collapse;}
  thead tr{background:#eef2fb;}
  th{
    text-align:left;
    padding:10px 20px;
    font-size:12.5px;
    color:#4c5566;
    font-weight:700;
  }
  td{
    padding:11px 20px;
    font-size:13.5px;
    border-top:1px solid var(--divider);
    color:var(--text-dark);
  }
  tr.highlight td{background:#fdeceb;}
  .onu-id{color:#3579f6;font-weight:600;}
  .status-offline{color:#c0392b;font-weight:700;}
  .empty-state{
    text-align:center;
    color:var(--text-lightgray);
    padding:26px 0;
    font-size:14px;
  }

  @media (max-width:700px){
    .controls-row{flex-wrap:wrap;}
    table{font-size:12px;}
    th,td{padding:8px 10px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <a href="dashboard.html" style="display:inline-block;margin-bottom:14px;color:#3579f6;font-size:13.5px;text-decoration:none;">← Home</a>
  <div class="card">
    <div class="header-row">
      <div>
        <h1>Live Offline ONUs</h1>
        <p class="subtitle">Data is fetched directly from OLT web interface. Each PON is shown in its own section.</p>
      </div>
      <div class="source-info">
        Source: OLT Web View<br>
        <span id="lastUpdated"></span>
      </div>
    </div>

    <div class="controls-row">
      <div class="field">
        <label>OLT</label>
        <select id="oltSelect">
          <option>Ark OLT 1</option>
        </select>
      </div>
      <button class="refresh-btn" id="refreshBtn">Refresh</button>
    </div>

    <div class="summary-cards">
      <div class="sum-card">
        <div class="sum-title">Total Offline ONUs</div>
        <div class="sum-value" id="totalVal">-</div>
      </div>
      <div class="sum-card wiredown">
        <div class="sum-title">Wire Down</div>
        <div class="sum-value" id="wireVal">0</div>
        <div class="sum-sub" id="wireSub" style="display:none;"></div>
      </div>
      <div class="sum-card poweroff">
        <div class="sum-title">Power Off / Other</div>
        <div class="sum-value" id="powerVal">0</div>
      </div>
      <div class="sum-card na">
        <div class="sum-title">N/A</div>
        <div class="sum-value" id="naVal">0</div>
      </div>
    </div>

    <div class="loaded-note" id="loadedNote" style="display:none;">Loaded offline ONUs for all PONs on selected OLT.</div>

    <div id="ponContainer"></div>
  </div>
</div>

<script>
  const BACKEND_URL = window.ISP_BACKEND_URL;

  function timeAgo(iso){
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs/60000);
    if(mins < 60) return mins + ' m ago';
    const hrs = Math.floor(mins/60);
    if(hrs < 24) return hrs + ' h ' + (mins%60) + ' m ago';
    const days = Math.floor(hrs/24);
    return days + ' d ' + (hrs%24) + ' h ago';
  }
  function fmtTime(iso){
    const d = new Date(iso);
    return d.toDateString().replace(/^\w+ /,'') + ' ' + d.toTimeString().slice(0,8);
  }

  // Converts backend rows (grouped by PON) into the same [#, time, id, status, reason, desc, since, highlight] shape the renderer expects
  function toRows(list){
    return list.map((o, i) => [
      String(i+1), fmtTime(o.disconnected_at), o.onu_id, 'Offline', o.reason, o.name, timeAgo(o.disconnected_at), o.reason==='Wire Down'
    ]);
  }

  function ponSummary(rows){
    let wire=0, power=0, na=0;
    rows.forEach(r=>{
      if(r[4]==="Wire Down") wire++;
      else if(r[4]==="Power Off") power++;
      else na++;
    });
    return {offline: rows.length, wire, power, na};
  }

  function renderEmpty(){
    const container = document.getElementById('ponContainer');
    container.innerHTML = '';
    ["PON 1","PON 2","PON 3"].forEach(name=>{
      container.innerHTML += `
        <div class="pon-section">
          <div class="pon-header">
            <span>${name}</span>
            <span class="pon-offline">Offline: -</span>
          </div>
          <table>
            <thead><tr><th>#</th><th>Time</th><th>ONU ID</th><th>Status</th><th>Reason</th><th>Description</th><th>Since</th></tr></thead>
          </table>
          <div class="empty-state">No data loaded yet.</div>
        </div>`;
    });
  }

  async function renderLoaded(){
    const container = document.getElementById('ponContainer');
    let grouped;
    try{
      const res = await fetch(`${BACKEND_URL}/api/offline-onus?olt_id=1`);
      grouped = await res.json();
    } catch(err){
      container.innerHTML = `<div style="color:#c0392b;padding:20px;">⚠ Could not reach backend at ${BACKEND_URL}. Start it with:<br><code>node backend/server.js</code></div>`;
      return;
    }

    container.innerHTML = '';
    let totalOffline=0, totalWire=0, totalPower=0, totalNA=0;
    const wireByPon = [];

    Object.keys(grouped).forEach(ponName=>{
      const rows = toRows(grouped[ponName]);
      const s = ponSummary(rows);
      totalOffline += s.offline; totalWire += s.wire; totalPower += s.power; totalNA += s.na;
      if(s.wire>0) wireByPon.push(`${ponName}: ${s.wire}`);

      let rowsHtml = rows.map(r=>`
        <tr class="${r[7] ? 'highlight':''}">
          <td>${r[0]}</td><td>${r[1]}</td>
          <td class="onu-id">${r[2]}</td>
          <td class="status-offline">${r[3]}</td>
          <td>${r[4]}</td><td>${r[5]}</td><td>${r[6]}</td>
        </tr>`).join('');

      container.innerHTML += `
        <div class="pon-section">
          <div class="pon-header">
            <span>${ponName}</span>
            <span class="pon-offline">Offline: ${s.offline} · Wire Down: ${s.wire} · Power Off/Other: ${s.power} · N/A: ${s.na}</span>
          </div>
          <table>
            <thead><tr><th>#</th><th>Time</th><th>ONU ID</th><th>Status</th><th>Reason</th><th>Description</th><th>Since</th></tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>`;
    });

    document.getElementById('totalVal').textContent = totalOffline;
    document.getElementById('wireVal').textContent = totalWire;
    document.getElementById('powerVal').textContent = totalPower;
    document.getElementById('naVal').textContent = totalNA;
    const wireSub = document.getElementById('wireSub');
    wireSub.textContent = wireByPon.join(' · ');
    wireSub.style.display = wireByPon.length ? 'block' : 'none';
    document.getElementById('loadedNote').style.display = 'block';

    const now = new Date();
    document.getElementById('lastUpdated').textContent = 'Last updated: ' +
      now.toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'numeric'}) + ', ' +
      now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit'});
  }

  document.getElementById('refreshBtn').addEventListener('click', async function(){
    this.disabled = true;
    this.textContent = 'Refreshing...';
    await renderLoaded();
    this.disabled = false;
    this.textContent = 'Refresh';
  });

  renderEmpty();
</script>
</body>
</html>
