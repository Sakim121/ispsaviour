<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Network Map</title>
<script src="config.js"></script>
<script src="auth.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --text-dark:#1f2430;
    --text-gray:#6b7280;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:#111;}
  #map{position:absolute;inset:0;}

  /* top status bar */
  .status-bar{
    position:absolute;
    top:14px;left:50%;transform:translateX(-50%);
    z-index:1000;
    background:rgba(255,255,255,.95);
    border-radius:999px;
    padding:8px 18px;
    display:flex;align-items:center;gap:10px;
    font-size:13px;
    box-shadow:0 4px 14px rgba(0,0,0,.2);
  }
  .status-bar .opt{display:flex;align-items:center;gap:5px;color:#555;}
  .status-bar .opt.active{color:#111;font-weight:700;}
  .status-bar .dot{width:9px;height:9px;border-radius:50%;border:2px solid #999;}
  .status-bar .opt.active .dot{background:#e23f3f;border-color:#e23f3f;}
  .status-bar .time{color:#555;}

  /* custom markers */
  .onu-marker{
    width:20px;height:20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:10px;
    box-shadow:0 0 0 2px #fff, 0 2px 6px rgba(0,0,0,.35);
  }
  .onu-online{background:#2bb24c;}
  .onu-wiredown{background:#e23f3f;}
  .onu-poweroff{background:#8b909c;}
  .jb-marker{
    width:16px;height:16px;border-radius:50%;background:#2b7cff;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:8px;font-weight:700;
    box-shadow:0 0 0 2px #fff, 0 2px 6px rgba(0,0,0,.35);
  }

  /* popups */
  .leaflet-popup-content-wrapper{border-radius:14px;padding:0;overflow:hidden;}
  .leaflet-popup-content{margin:0;width:300px !important;}
  .leaflet-popup-tip{background:#fff;}
  .popup-card{padding:16px 18px 18px;}
  .popup-card.online{background:#eaf9ee;}
  .popup-card.wiredown{background:#fdecec;}
  .popup-card.poweroff{background:#f1f2f4;}
  .popup-title-row{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:10px;
  }
  .popup-name{font-weight:800;font-size:15.5px;color:var(--text-dark);}
  .popup-status-label{font-weight:700;font-size:13px;margin-left:6px;}
  .popup-status-label.online{color:#1f9d43;}
  .popup-status-label.wiredown{color:#c0392b;}
  .popup-status-label.poweroff{color:#5f6672;}
  .popup-icon{font-size:16px;color:#555;}
  .popup-row{
    display:flex;justify-content:space-between;gap:14px;
    font-size:13px;padding:4px 0;color:#374151;
  }
  .popup-row b{font-weight:700;color:#1f2430;text-align:right;}
  .popup-link{
    display:block;color:#2b6cb0;text-decoration:underline;
    font-size:13px;margin-top:10px;
  }
  .rx-history{margin-top:10px;border-top:1px solid rgba(0,0,0,.08);padding-top:10px;}
  .rx-history-title{font-weight:700;font-size:12.5px;margin-bottom:6px;}
  .rx-history-row{display:flex;justify-content:space-between;font-size:12px;color:#374151;padding:2px 0;}

  .cust-popup{background:#eaf9ee;padding:16px 18px 18px;}
  .cust-header-row{display:flex;justify-content:space-between;align-items:flex-start;}
  .cust-back{
    border:1px solid #b8e2c4;background:#fff;border-radius:6px;
    width:26px;height:26px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:14px;color:#333;
  }
  .cust-sub{font-weight:700;font-size:12.5px;color:#374151;margin:2px 0 10px;}

  /* bottom control bar */
  .ctrl-panel{
    position:absolute;
    bottom:14px;left:50%;transform:translateX(-50%);
    z-index:1000;
    background:#fff;
    border-radius:14px;
    padding:10px 16px 12px;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
    max-width:96vw;
  }
  .ctrl-row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ctrl-row1 select{
    padding:8px 10px;border-radius:8px;border:1px solid #e3e6ec;font-size:13px;color:#1f2430;background:#fff;
  }
  .ctrl-btn-round{
    width:30px;height:30px;border-radius:50%;border:none;color:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;
  }
  .ctrl-btn-round.green{background:#2bb24c;}
  .ctrl-btn-round.dark{background:#3d4451;}
  .ctrl-btn-round.red{background:#e23f3f;}
  .ctrl-btn-round.blue{background:#2b7cff;}
  .ctrl-search{
    flex:1;min-width:140px;padding:8px 12px;border-radius:8px;border:1px solid #e3e6ec;font-size:13px;
  }
  .ctrl-row2, .ctrl-row3{
    display:flex;gap:16px;flex-wrap:wrap;
    font-size:12.5px;color:#374151;margin-top:8px;
  }
  .ctrl-row2 label, .ctrl-row3 label{display:flex;align-items:center;gap:5px;cursor:pointer;}
  .ctrl-row2 input, .ctrl-row3 input{accent-color:#2b7cff;}
  .show-label{font-weight:700;color:#1f2430;margin-right:2px;}

  .back-link{
    position:absolute;top:14px;left:14px;z-index:1000;
    background:#fff;border-radius:8px;padding:8px 14px;font-size:13px;
    box-shadow:0 4px 14px rgba(0,0,0,.2);color:#1f2430;text-decoration:none;
  }

  @media (max-width:640px){
    .leaflet-popup-content{width:250px !important;}
    .ctrl-panel{left:8px;right:8px;transform:none;width:auto;}
  }
</style>
</head>
<body>

<a class="back-link" href="dashboard.html">← Home</a>

<div class="status-bar">
  <span class="opt"><span class="dot"></span>DB</span>
  <span class="opt active"><span class="dot"></span>LIVE</span>
  <span class="time">Live Data at: <span id="liveClock">--:--:--</span></span>
</div>

<div id="map"></div>

<div class="ctrl-panel">
  <div class="ctrl-row1">
    <select><option>Ark OLT 1</option></select>
    <select><option>PON 3 - YMR, Korrapadu Rd, HB Colony</option></select>
    <button class="ctrl-btn-round green">➤</button>
    <button class="ctrl-btn-round dark">⚙</button>
    <input class="ctrl-search" id="onuSearch" placeholder="Search ONU..">
    <button class="ctrl-btn-round red">🔍</button>
    <button class="ctrl-btn-round blue" id="refreshMap">↻</button>
    <button class="ctrl-btn-round dark">▦</button>
  </div>
  <div class="ctrl-row2">
    <span class="show-label">Show:</span>
    <label><input type="checkbox" id="chkLandmarks" checked> Landmarks</label>
    <label><input type="checkbox" id="chkPaths" checked> Paths</label>
    <label><input type="checkbox" id="chkOnus" checked> ONUs</label>
    <label><input type="checkbox" id="chkDevices"> Devices (C/S)</label>
    <label><input type="checkbox" id="chkArrows"> Arrows</label>
    <label><input type="checkbox" id="chkOnline" checked> Online</label>
    <label><input type="checkbox" id="chkOffline" checked> Offline</label>
    <label><input type="checkbox" id="chkWiredown" checked> Wire-down</label>
  </div>
  <div class="ctrl-row3">
    <label><input type="checkbox"> RX Pwr</label>
    <label><input type="checkbox"> Est Pwr</label>
    <label><input type="checkbox"> Diff Pwr</label>
    <label><input type="checkbox"> Trace Wiredown</label>
    <label><input type="checkbox"> Loss Scan</label>
  </div>
</div>

<script>
  // ===== live clock =====
  function tick(){
    const d = new Date();
    document.getElementById('liveClock').textContent =
      d.toTimeString().slice(0,8);
  }
  tick(); setInterval(tick, 1000);

  // ===== map =====
  const map = L.map('map', {zoomControl:false}).setView([15.4989, 78.4983], 17);

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics',
    maxZoom: 20
  }).addTo(map);

  L.control.zoom({position:'topleft'}).addTo(map);
  L.control.layers(null,null,{position:'topright', collapsed:true}).addTo(map);

  // ===== data =====
  const BACKEND_URL = window.ISP_BACKEND_URL;
  const base = [15.4989, 78.4983];
  function off(dLat,dLng){ return [base[0]+dLat/1000, base[1]+dLng/1000]; }

  const DEMO_ONUS = [
    {pos: off(0.5,0.3), status:'online', name:'abdul1',
     detail:{id:'EPON0/3:3', mac:'30:D1:7E:9E:57:C5', dist:'720', rx:'-13.85 dBm', connected:'31/03/2026 17:05', since:'1M 6d 2h ago'}},
    {pos: off(-0.3,-0.6), status:'poweroff', name:'rrraja',
     detail:{id:'EPON0/3:23', mac:'4C:AE:1C:B8:5B:DC', dist:'4847', disconnected:'07/05/2026 12:42', offlineFor:'7 h ago', reason:'Power Off'}},
    {pos: off(0.15,1.4), status:'online', name:'shekarshop',
     detail:{id:'EPON0/3:24', mac:'A8:E2:07:31:B6:65', dist:'646', rx:'-16.11 dBm', connected:'14/04/2026 11:06', since:'23d 8h ago'},
     rxHistory:[['07/05/26 15:30','-16.25'],['07/05/26 11:50','-16.09'],['07/05/26 08:00','-16.16'],['07/05/26 01:35','-16.04'],['06/05/26 21:50','-16.07']],
     customer:{username:'shekarshop (10014)', account:'Active', status:'Online', ip:'10.21.22.31', mac:'F4:8C:EB:8D:7C:E1', loggedIn:'7th May 2026 09:33 AM', since:'10 h 31 m 41 s', download:'11.41GB', upload:'985.03MB', total:'12.37GB'}},
    {pos: off(0.7,-0.9), status:'wiredown', name:'ArkComboBox',
     detail:{id:'EPON0/3:51', mac:'14:A7:2B:A6:19:37', dist:'946', disconnected:'24/04/2026 10:04', offlineFor:'13d 9h ago', reason:'Wire Down'}}
  ];

  function fmtDMY(iso){
    if(!iso) return '-';
    const d = new Date(iso);
    return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()+' '+d.toTimeString().slice(0,5);
  }
  function agoStr(iso){
    if(!iso) return '-';
    const mins = Math.floor((Date.now()-new Date(iso).getTime())/60000);
    if(mins<60) return mins+' m ago';
    const hrs = Math.floor(mins/60);
    if(hrs<24) return hrs+' h '+(mins%60)+' m ago';
    const days = Math.floor(hrs/24);
    return days+' d '+(hrs%24)+' h ago';
  }

  async function onuFromBackend(o){
    const statusMap = {'Online':'online', 'Power Off':'poweroff', 'Wire Down':'wiredown'};
    const status = statusMap[o.status];
    if(!status || o.latitude == null) return null; // skip plain "Offline" rows with no GPS/status mapping

    const item = { pos:[o.latitude, o.longitude], status, name:o.name };
    if(status==='online'){
      item.detail = {
        id:o.onu_id, mac:o.mac, dist:o.distance, rx: o.rx_power!=null ? o.rx_power+' dBm' : 'N/A',
        connected: fmtDMY(o.connected_at), since: agoStr(o.connected_at)
      };
      if(o.radius_username){
        item.customer = {
          username:o.radius_username, account:o.radius_account, status:o.radius_status,
          ip:o.radius_ip, mac:o.radius_mac, loggedIn:fmtDMY(o.logged_in_at), since: agoStr(o.logged_in_at),
          download:(o.download_usage_gb!=null?o.download_usage_gb+'GB':'-'),
          upload:(o.upload_usage_mb!=null?o.upload_usage_mb+'MB':'-'),
          total:(o.download_usage_gb!=null&&o.upload_usage_mb!=null?(o.download_usage_gb+o.upload_usage_mb/1024).toFixed(2)+'GB':'-')
        };
      }
      try{
        const hres = await fetch(`${BACKEND_URL}/api/onus/${o.id}/rx-history`);
        const hist = await hres.json();
        if(hist.length) item.rxHistory = hist.map(h=>[fmtDMY(h.timestamp).replace(' ',' '), h.rx_power.toFixed(2)]);
      } catch(e){ /* rx history optional */ }
    } else {
      item.detail = {
        id:o.onu_id, mac:o.mac, dist:o.distance,
        disconnected: fmtDMY(o.disconnected_at), offlineFor: agoStr(o.disconnected_at), reason:o.reason
      };
    }
    return item;
  }

  async function loadOnus(){
    try{
      const res = await fetch(`${BACKEND_URL}/api/onus?pon_id=3`);
      const raw = await res.json();
      const mapped = (await Promise.all(raw.map(onuFromBackend))).filter(Boolean);
      if(mapped.length === 0) throw new Error('no positioned ONUs returned');
      return mapped;
    } catch(err){
      console.warn('Backend unavailable, showing demo ONUs on the map:', err);
      return DEMO_ONUS;
    }
  }

  const layerGroups = {
    jb: L.layerGroup().addTo(map),
    online: L.layerGroup().addTo(map),
    wiredown: L.layerGroup().addTo(map),
    offlinePower: L.layerGroup().addTo(map),
    paths: L.layerGroup().addTo(map)
  };
  const jbIcon = L.divIcon({className:'', html:'<div class="jb-marker">JB</div>', iconSize:[16,16]});

  const markerRefs = {};
  let onuMarkers = [];

  function popupHtmlFor(o){
    if(o.status==='online'){
      let rxBlock = '';
      if(o.rxHistory){
        rxBlock = `<div class="rx-history"><div class="rx-history-title">Last 5 RX Power</div>` +
          o.rxHistory.map(r=>`<div class="rx-history-row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('') +
          `<a class="popup-link">More Records...</a></div>`;
      }
      const custLink = o.customer ? `<a class="popup-link" onclick="showCustomer('${o.name}')">Account details ›</a>` : '';
      return `<div class="popup-card online">
        <div class="popup-title-row">
          <div><span class="popup-name">${o.name}</span><span class="popup-status-label online">Online</span></div>
          <span class="popup-icon">📶</span>
        </div>
        <div class="popup-row"><span>ONU ID</span><b>${o.detail.id}</b></div>
        <div class="popup-row"><span>Status</span><b>Online</b></div>
        <div class="popup-row"><span>MAC</span><b>${o.detail.mac}</b></div>
        <div class="popup-row"><span>Distance(m)</span><b>${o.detail.dist}</b></div>
        <div class="popup-row"><span>RX Power</span><b>${o.detail.rx}</b></div>
        <div class="popup-row"><span>Connected</span><b>${o.detail.connected}</b></div>
        <div class="popup-row"><span>Online Since</span><b>${o.detail.since}</b></div>
        ${rxBlock}
        ${custLink}
        <a class="popup-link">Open in Google Maps</a>
      </div>`;
    } else if(o.status==='wiredown'){
      return `<div class="popup-card wiredown">
        <div class="popup-title-row">
          <div><span class="popup-name">${o.name}</span><span class="popup-status-label wiredown">Wire Down</span></div>
          <span class="popup-icon">✂️</span>
        </div>
        <div class="popup-row"><span>ONU ID</span><b>${o.detail.id}</b></div>
        <div class="popup-row"><span>Status</span><b>Wire Down</b></div>
        <div class="popup-row"><span>MAC</span><b>${o.detail.mac}</b></div>
        <div class="popup-row"><span>Distance(m)</span><b>${o.detail.dist}</b></div>
        <div class="popup-row"><span>RX Power</span><b>N/A</b></div>
        <div class="popup-row"><span>Disconnected</span><b>${o.detail.disconnected}</b></div>
        <div class="popup-row"><span>Offline For</span><b>${o.detail.offlineFor}</b></div>
        <div class="popup-row"><span>Reason</span><b>${o.detail.reason}</b></div>
        <a class="popup-link">Open in Google Maps</a>
      </div>`;
    } else {
      return `<div class="popup-card poweroff">
        <div class="popup-title-row">
          <div><span class="popup-name">${o.name}</span><span class="popup-status-label poweroff">Power Off</span></div>
          <span class="popup-icon">⏻</span>
        </div>
        <div class="popup-row"><span>ONU ID</span><b>${o.detail.id}</b></div>
        <div class="popup-row"><span>Status</span><b>Power Off</b></div>
        <div class="popup-row"><span>MAC</span><b>${o.detail.mac}</b></div>
        <div class="popup-row"><span>Distance(m)</span><b>${o.detail.dist}</b></div>
        <div class="popup-row"><span>RX Power</span><b>N/A</b></div>
        <div class="popup-row"><span>Disconnected</span><b>${o.detail.disconnected}</b></div>
        <div class="popup-row"><span>Offline For</span><b>${o.detail.offlineFor}</b></div>
        <div class="popup-row"><span>Reason</span><b>${o.detail.reason}</b></div>
        <a class="popup-link">Open in Google Maps</a>
      </div>`;
    }
  }

  function customerHtmlFor(o){
    const c = o.customer;
    return `<div class="cust-popup">
      <div class="cust-header-row">
        <div>
          <span class="popup-name">${o.name} Online (OLT)</span>
        </div>
        <button class="cust-back" onclick="backToOnu('${o.name}')">←</button>
      </div>
      <div class="cust-sub">AAA / IconRadius</div>
      <div class="popup-row"><span>Username</span><b>${c.username}</b></div>
      <div class="popup-row"><span>Account</span><b>${c.account}</b></div>
      <div class="popup-row"><span>Status</span><b>${c.status}</b></div>
      <div class="popup-row"><span>IpAddress</span><b>${c.ip}</b></div>
      <div class="popup-row"><span>MAC</span><b>${c.mac}</b></div>
      <div class="popup-row"><span>Logged In</span><b>${c.loggedIn}</b></div>
      <div class="popup-row"><span>Online Since</span><b>${c.since}</b></div>
      <div class="popup-row"><span>Download</span><b>${c.download}</b></div>
      <div class="popup-row"><span>Upload</span><b>${c.upload}</b></div>
      <div class="popup-row"><span>Total</span><b>${c.total}</b></div>
    </div>`;
  }

  async function init(){
    const onus = await loadOnus();

    // center the map on the loaded data
    const avgLat = onus.reduce((s,o)=>s+o.pos[0],0)/onus.length;
    const avgLng = onus.reduce((s,o)=>s+o.pos[1],0)/onus.length;
    map.setView([avgLat, avgLng], 17);

    // simple decorative backbone: OLT point near the centroid -> each ONU
    const oltPoint = [avgLat + 0.001, avgLng - 0.002];
    L.polyline([oltPoint, ...onus.map(o=>o.pos)], {color:'#ff5fa2', weight:2, opacity:0.55}).addTo(layerGroups.paths);
    onus.forEach(o=>{
      L.polyline([oltPoint, o.pos], {color:'#2bb24c', weight:2, dashArray:'4,6'}).addTo(layerGroups.paths);
    });
    // a couple of decorative JB device markers along the backbone
    [0.35, 0.7].forEach(t=>{
      const lat = oltPoint[0] + (avgLat-oltPoint[0])*t;
      const lng = oltPoint[1] + (avgLng-oltPoint[1])*t;
      L.marker([lat,lng], {icon:jbIcon}).addTo(layerGroups.jb);
    });

    onus.forEach(o=>{
      const cls = o.status==='online' ? 'onu-online' : (o.status==='wiredown' ? 'onu-wiredown' : 'onu-poweroff');
      const glyph = o.status==='online' ? '●' : (o.status==='wiredown' ? '✕' : '⏻');
      const icon = L.divIcon({className:'', html:`<div class="onu-marker ${cls}">${glyph}</div>`, iconSize:[20,20]});
      const group = o.status==='online' ? layerGroups.online : (o.status==='wiredown' ? layerGroups.wiredown : layerGroups.offlinePower);
      const marker = L.marker(o.pos, {icon}).addTo(group);
      marker.bindPopup(popupHtmlFor(o), {closeButton:true, maxWidth:320});
      markerRefs[o.name] = {marker, data:o};
      onuMarkers.push({name:o.name, marker});
    });
  }

  window.showCustomer = function(name){
    const ref = markerRefs[name];
    if(ref && ref.data.customer){
      ref.marker.setPopupContent(customerHtmlFor(ref.data));
    }
  };
  window.backToOnu = function(name){
    const ref = markerRefs[name];
    if(ref){
      ref.marker.setPopupContent(popupHtmlFor(ref.data));
    }
  };

  // ===== layer toggles =====
  document.getElementById('chkPaths').addEventListener('change', e=>{
    if(e.target.checked) map.addLayer(layerGroups.paths); else map.removeLayer(layerGroups.paths);
  });
  document.getElementById('chkOnus').addEventListener('change', e=>{
    ['online','wiredown','offlinePower'].forEach(k=>{
      if(e.target.checked){
        if(document.getElementById(k==='online'?'chkOnline':k==='wiredown'?'chkWiredown':'chkOffline').checked) map.addLayer(layerGroups[k]);
      } else map.removeLayer(layerGroups[k]);
    });
  });
  document.getElementById('chkOnline').addEventListener('change', e=>{
    if(e.target.checked) map.addLayer(layerGroups.online); else map.removeLayer(layerGroups.online);
  });
  document.getElementById('chkOffline').addEventListener('change', e=>{
    if(e.target.checked) map.addLayer(layerGroups.offlinePower); else map.removeLayer(layerGroups.offlinePower);
  });
  document.getElementById('chkWiredown').addEventListener('change', e=>{
    if(e.target.checked) map.addLayer(layerGroups.wiredown); else map.removeLayer(layerGroups.wiredown);
  });
  document.getElementById('chkDevices').addEventListener('change', e=>{
    if(e.target.checked) map.addLayer(layerGroups.jb); else map.removeLayer(layerGroups.jb);
  });
  // Devices(C/S) unchecked by default per reference - hide jb initially
  map.removeLayer(layerGroups.jb);

  document.getElementById('refreshMap').addEventListener('click', ()=>{
    tick();
  });

  document.getElementById('onuSearch').addEventListener('keydown', e=>{
    if(e.key==='Enter'){
      const q = e.target.value.trim().toLowerCase();
      const found = onuMarkers.find(m=>m.name.toLowerCase().includes(q));
      if(found){
        map.setView(found.marker.getLatLng(), 18);
        found.marker.openPopup();
      }
    }
  });

  init();
</script>
</body>
</html>
